# Standalone production stack; use a distinct project name and a NEW MySQL volume.
services:
  web:
    image: srms-school:${SRMS_RELEASE:-local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./srms.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql -h 127.0.0.1 -u$${MYSQL_USER} -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  sms-worker:
    image: srms-school:${SRMS_RELEASE:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: production
    command: ["php", "scripts/process-parent-sms.php", "--loop"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["notifications"]
    security_opt: ["no-new-privileges:true"]
volumes:
  mysql-data:
