ServerName srms
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(includes|scripts|tests|database-updates|deploy|docs|sass)(/|$)">
    Require all denied
</DirectoryMatch>
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(\.tmp\.|\.(sql|log|ini|env|bak|tmp|md|ya?ml|json|py|map)$|^Dockerfile$|^password_hash\.php$|^process-email-queue\.php$)">
    Require all denied
</FilesMatch>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "same-origin"

<LocationMatch "^/js/DataTables/(?!datatables\.min\.(js|css)$)">
    Require all denied
</LocationMatch>
<FilesMatch "^jquery-2\.2\.4.*\.js$">
    Require all denied
</FilesMatch>
