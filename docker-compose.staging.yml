# Standalone local deployment of a published Jenkins image.
name: srms-staging

services:
  schema:
    image: ${SRMS_STAGING_IMAGE:?Set SRMS_STAGING_IMAGE to a published Jenkins image}
    entrypoint: ["sh", "-c", "cp /var/www/html/srms.sql /schema/001-schema.sql"]
    network_mode: none
    read_only: true
    volumes:
      - schema:/schema
    security_opt: ["no-new-privileges:true"]

  db:
    image: mysql:8.4
    # Keep this practice database modest on a development laptop.
    command: ["--innodb-buffer-pool-size=67108864", "--mysqlx=OFF"]
    environment:
      MYSQL_DATABASE: ${SRMS_STAGING_DB_NAME:-srms_staging}
      MYSQL_USER: ${SRMS_STAGING_DB_USER:-staging_user}
      MYSQL_PASSWORD: ${SRMS_STAGING_DB_PASSWORD:?Set a staging database password}
      MYSQL_ROOT_PASSWORD: ${SRMS_STAGING_ROOT_PASSWORD:?Set a staging root password}
    depends_on:
      schema:
        condition: service_completed_successfully
    volumes:
      - mysql-data:/var/lib/mysql
      - schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql -h 127.0.0.1 -u$${MYSQL_USER} -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${SRMS_STAGING_IMAGE:?Set SRMS_STAGING_IMAGE to a published Jenkins image}
    environment:
      DB_HOST: db
      DB_NAME: ${SRMS_STAGING_DB_NAME:-srms_staging}
      DB_USER: ${SRMS_STAGING_DB_USER:-staging_user}
      DB_PASS: ${SRMS_STAGING_DB_PASSWORD:?Set a staging database password}
      APP_ENV: staging
      APP_URL: http://127.0.0.1:${SRMS_STAGING_PORT:-5001}
      APP_TIMEZONE: Africa/Nairobi
      SCHOOL_NAME: SRMS Local Staging
      SESSION_COOKIE_SECURE: "false"
      AFRICASTALKING_SMS_ENABLED: "false"
      MAIL_ENABLED: "false"
    ports:
      - "127.0.0.1:${SRMS_STAGING_PORT:-5001}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health.php"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

volumes:
  mysql-data:
  schema:
